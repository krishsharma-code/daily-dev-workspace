<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Markdown Notes</h1>
    <div class="topbar-actions">
      <span id="status" class="status" role="status" aria-live="polite"></span>
      <button id="new-note" type="button" class="primary">New note</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <input id="search" type="search" placeholder="Search notes" aria-label="Search notes">
      <ul id="note-list" class="note-list" aria-label="Saved notes"></ul>
    </aside>

    <section class="editor-pane">
      <input id="title" type="text" placeholder="Note title" aria-label="Note title" maxlength="200">
      <textarea id="body" spellcheck="true" aria-label="Note body"
        placeholder="# Start writing&#10;&#10;Headings, **bold**, `code`, lists and quotes are supported."></textarea>
      <footer class="editor-footer">
        <span id="meta" class="meta"></span>
        <div class="editor-actions">
          <button id="delete-note" type="button" class="danger">Delete</button>
          <button id="save-note" type="button" class="primary">Save <kbd>⌘/Ctrl+S</kbd></button>
        </div>
      </footer>
    </section>

    <section class="preview-pane">
      <nav id="outline" class="outline" aria-label="Document outline"></nav>
      <article id="preview" class="preview"></article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
